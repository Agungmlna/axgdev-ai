<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AXGDEV23 AI</title>
  <style>
    :root { --bg:#0f1115; --panel:#171a21; --text:#e8eaf0; --muted:#8a90a0; --accent:#00a88f; --user:#00a88f; --bot:#22262f; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--text); height:100dvh; display:flex; flex-direction:column; }
    header { padding:14px 18px; border-bottom:1px solid #242933; display:flex; align-items:center; gap:10px; }
    header .dot { width:10px; height:10px; border-radius:50%; background:var(--accent); }
    header h1 { font-size:16px; margin:0; font-weight:600; }
    header span { color:var(--muted); font-size:13px; margin-left:auto; }
    #chat { flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:12px; }
    .msg { max-width:80%; padding:10px 14px; border-radius:14px; line-height:1.5; white-space:pre-wrap; word-wrap:break-word; }
    .user { align-self:flex-end; background:var(--user); color:#fff; border-bottom-right-radius:4px; }
    .bot { align-self:flex-start; background:var(--bot); border-bottom-left-radius:4px; }
    .hint { color:var(--muted); text-align:center; margin:auto; font-size:14px; }
    form { display:flex; gap:10px; padding:14px; border-top:1px solid #242933; }
    input { flex:1; padding:12px 14px; border-radius:10px; border:1px solid #2d3340; background:var(--panel); color:var(--text); font-size:16px; outline:none; }
    input:focus { border-color:var(--accent); }
    button { padding:0 18px; border:0; border-radius:10px; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; }
    button:disabled { opacity:.5; cursor:default; }
  </style>
</head>
<body>
  <header>
    <div class="dot"></div>
    <h1>AXGDEV23 AI</h1>
    <span>Asisten AI</span>
  </header>
  <div id="chat">
    <div class="hint">Tanyakan apa saja tentang layanan AXGDEV23.</div>
  </div>
  <form id="form">
    <input id="input" placeholder="Ketik pesan..." autocomplete="off" required />
    <button id="send" type="submit">Kirim</button>
  </form>

  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const history = [];

    function addMsg(text, who) {
      const hint = chat.querySelector(".hint");
      if (hint) hint.remove();
      const div = document.createElement("div");
      div.className = "msg " + who;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      send.disabled = true;
      addMsg(text, "user");
      history.push({ role: "user", content: text });
      const thinking = addMsg("Mengetik...", "bot");

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ messages: history }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Error");
        thinking.textContent = data.reply;
        history.push({ role: "assistant", content: data.reply });
      } catch (err) {
        thinking.textContent = "Maaf, terjadi kesalahan: " + err.message;
        history.pop();
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
